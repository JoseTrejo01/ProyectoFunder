[php]
version = "8.2"

# Extensiones necesarias para tu app
extensions = [
  "gd",
  "pdo_mysql",
  "mbstring",
  "openssl",
  "bcmath",
  "xml",
  "ctype",
  "json",
  "tokenizer"
]

[build]
# Instalar dependencias PHP
commands = [
  "composer install --no-dev --optimize-autoloader"
]

# Instalar Node y dependencias JS
[build.node]
version = "20"
commands = [
  "npm install",
  "npm run build"
]

[start]
# Comando para iniciar Laravel
command = "php artisan serve --host=0.0.0.0 --port=8080"
